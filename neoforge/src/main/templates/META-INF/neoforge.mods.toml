modLoader = "javafml"
loaderVersion = "${neoForgeCompatibleLoaderVersion}"
issueTrackerURL = "${modIssueTracker}"
license = "${modLicense}"

[[mods]]
    modId = "smartcompletion"
    version = "${version}"
    displayName = "${modName}"
    authors = "${modAuthor}"
    description = "${modDescription}"
    displayURL = "${modPage}"
    updateJSONURL = "${modUpdatesJSON}"
    logoFile = "icon.png"
    logoBlur = false

[[dependencies.smartcompletion]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neoForgeCompatibleMinecraftVersion}"
    ordering = "NONE"
    side = "BOTH"
[[dependencies.smartcompletion]]
    modId = "minecraft"
    type = "required"
    versionRange = "${neoForgeCompatibleMinecraftVersion}"
    ordering = "NONE"
    side = "BOTH"

[[mixins]]
    config = "${modId}.mixins.json"
