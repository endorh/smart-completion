## Gradle Properties

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ------------------------------------------------------------------------------

## Environment Properties

# Minecraft version
#   See `build.gradle.kts` and `forEachVersion` for details
## Maximum Minecraft versions, used to define preprocessor symbols (keep accurate)
maxMcVersions = 26.1.2,26.2
## Supported Minecraft versions with matching .properties file under `versionProperties`
##   Used by the buildAll script to build all supported versions (keep in a single line)
mcVersions = 26.1.2,26.2
## Target Minecraft version, override with `-PmcVersion=MC_VERSION` on the command line
mcVersion = 26.2

### Manifold
manifoldVersion = 2026.1.8

